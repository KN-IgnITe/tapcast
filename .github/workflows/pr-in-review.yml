name: Update Issue Status on PR

on:
  pull_request:
    # Action runs on opening, marking as ready, and converting to draft
    types: [opened, ready_for_review, reopened, converted_to_draft]

jobs:
  update-issue-status:
    runs-on: ubuntu-latest

    steps:
      - name: Extract Issue ID from PR branch name
        id: get_issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branchName = context.payload.pull_request.head.ref;
            console.log(`PR branch: ${branchName}`);
            
            const match = branchName.match(/\b(\d+)\b/);
            if (!match) {
              console.log("No issue number found in branch name. Skipping.");
              return;
            }
            
            const issueNum = parseInt(match[1], 10);
            
            try {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNum
              });
              
              core.setOutput('node_id', issue.node_id);
              console.log(`Found Issue #${issueNum}. Moving to project board...`);
            } catch (error) {
              console.log(`Issue #${issueNum} does not exist.`);
            }

      - name: Determine Target Column
        # Set variable depending on whether the PR is a Draft
        id: status
        run: |
          if [ "${{ github.event.pull_request.draft }}" == "true" ]; then
            echo "STATUS_VALUE=In Progress" >> $GITHUB_ENV
          else
            echo "STATUS_VALUE=In Review" >> $GITHUB_ENV
          fi

      - name: Update Project Status
        if: steps.get_issue.outputs.node_id != ''
        uses: leonsteinhaeuser/project-beta-automations@v2.2.1
        with:
          gh_token: ${{ secrets.PAT_TOKEN }}
          organization: KN-IGNITe
          project_id: 4
          resource_node_id: ${{ steps.get_issue.outputs.node_id }}
          status_value: ${{ env.STATUS_VALUE }}