name: Move Issue to In Progress

on:
  create # Trigger: runs when new things are created in the repo

jobs:
  extract-issues:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      node_ids: ${{ steps.get_issue.outputs.node_ids }}
    steps:
      - name: Extract Issue IDs from branch name
        id: get_issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branchName = context.payload.ref;
            console.log(`New branch: ${branchName}`);
            
            // Get the part after the slash, e.g. "69-68-fix-leak" from "backend/69-68-fix-leak"
            const parts = branchName.split('/');
            const namePart = parts[parts.length - 1];
            
            // Match numbers separated by hyphens at the start of the branch name part
            const match = namePart.match(/^(\d+(?:-\d+)*)/);
            if (!match) {
              console.log("No issue number found in branch name. Skipping.");
              core.setOutput('node_ids', JSON.stringify([]));
              return;
            }
            
            const issueNums = match[1].split('-').map(n => parseInt(n, 10));
            const nodeIds = [];
            
            for (const issueNum of issueNums) {
              try {
                // Get technical issue ID from GitHub
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNum
                });
                
                nodeIds.push(issue.node_id);
                console.log(`Found Issue #${issueNum}. Node ID: ${issue.node_id}`);
              } catch (error) {
                console.log(`Issue #${issueNum} does not exist.`);
              }
            }
            
            core.setOutput('node_ids', JSON.stringify(nodeIds));

  move-to-in-progress:
    needs: extract-issues
    if: needs.extract-issues.outputs.node_ids != '[]' && needs.extract-issues.outputs.node_ids != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node_id: ${{ fromJSON(needs.extract-issues.outputs.node_ids) }}
    steps:
      - name: Update Project Status
        uses: leonsteinhaeuser/project-beta-automations@v2.2.1
        with:
          gh_token: ${{ secrets.PAT_TOKEN }}
          organization: KN-IGNITe
          project_id: 4
          resource_node_id: ${{ matrix.node_id }}
          status_value: 'In Progress'
