name: PR Conditional Quality Checks

on:
  pull_request:
    branches: [ development, main ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      inference: ${{ steps.filter.outputs.inference }}
      training: ${{ steps.filter.outputs.training }}
      ml_common: ${{ steps.filter.outputs.ml_common }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Categorize changed files by module paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            inference:
              - 'inference/**'
              - 'ml_common/**'
            training:
              - 'training/**'
              - 'ml_common/**'
            ml_common:
              - 'ml_common/**'
            frontend:
              - 'frontend/**'
            docs:
              - 'docs/**'

  backend-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Go environment
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Generate Protobuf stubs and modern init files
        run: make proto

      - name: Download Go module dependencies
        run: cd backend && go mod download

      - name: Run Golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: backend

      - name: Execute Backend Unit Tests
        run: |
          cd backend
          go test -v ./...

  inference-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.inference == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Generate Protobuf stubs and modern init files
        run: make proto

      - name: Install Python quality tools & dependencies
        run: |
          pip install black flake8 mypy
          if [ -f inference/requirements.txt ]; then pip install -r inference/requirements.txt; fi

      - name: Run Black formatter check
        run: black --check inference/

      - name: Run Flake8 linter
        run: flake8 inference/ --max-line-length=88 --extend-exclude=inference/src/inference/pb/

      - name: Run Mypy static type checker
        run: mypy --ignore-missing-imports inference/

  training-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.training == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Wdrażamy oficjalną akcję z Marketplace'u
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      # Sprawdzamy, czy mamy już zapisane środowisko z poprzedniego uruchomienia
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: training/.venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('training/poetry.lock') }}

      # Instalujemy zależności ML tylko wtedy, gdy NIE znaleziono cache'u
      - name: Install dependencies via Poetry
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: |
          cd training
          poetry install --no-interaction

      - name: Run Black formatter check
        run: cd training && poetry run black --check src tests

      - name: Run Flake8 linter
        run: cd training && poetry run flake8 src tests

      - name: Run Mypy static type checker
        run: |
          cd training
          poetry run mypy --ignore-missing-imports src tests

      - name: Execute Training Module Tests
        run: |
          cd training
          poetry run pytest -v

  ml-common-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.ml_common == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: ml_common/.venv
          key: venv-ml-common-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('ml_common/poetry.lock') }}

      - name: Install dependencies via Poetry
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: |
          cd ml_common
          poetry install --no-interaction

      - name: Run Black formatter check
        run: cd ml_common && poetry run black --check src tests

      - name: Run Flake8 linter
        run: cd ml_common && poetry run flake8 src tests

      - name: Run Mypy static type checker
        run: |
          cd ml_common
          poetry run mypy --ignore-missing-imports src tests

      - name: Execute ML Common Module Tests
        run: |
          cd ml_common
          poetry run pytest -v  

  frontend-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install node dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Prettier formatting check
        run: |
          cd frontend
          npx prettier --check "src/**/*.{ts,tsx,js,jsx,css,html}"

      - name: Run ESLint check
        run: |
          cd frontend
          npx eslint .

      - name: Run TypeScript compilation check
        run: |
          cd frontend
          npx tsc --noEmit

  docs-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Run Markdownlint check against modified documentation
        uses: davidanson/markdownlint-cli2-action@v1
        with:
          globs: |
            docs/**/*.{md,markdown}
            !docs/adr/_template.md