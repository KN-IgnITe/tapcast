[project]
name = "training"
version = "0.1.0"
description = ""
authors = [
    {name = "M1KUS3Q",email = "mikolaj.popik@icloud.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pika (>=1.3.2,<2.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "xgboost (>=3.2.0,<4.0.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "scipy (>=1.17.1,<2.0.0)",
    "jsonschema (>=4.26.0,<5.0.0)",
    "rfc3339-validator (>=0.1.4,<0.2.0)",
    "psycopg[binary] (>=3.3.3,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
]

[tool.poetry]
packages = [{include = "training", from = "src"}]

[tool.poetry.dependencies]
ml-common = { path = "../ml_common", develop = true }
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.3.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "pandas-stubs (>=3.0.0.260204,<4.0.0.0)",
    "types-jsonschema (>=4.26.0.20260408,<5.0.0.0)",
    "pytest (>=9.0.3,<10.0.0)"
]

[tool.mypy]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "sklearn.*",
    "xgboost.*",
    "joblib.*"
]
ignore_missing_imports = true