[project]
name = "ml-common"
version = "0.1.0"
description = ""
authors = [
    {name = "Jakub Bogacz",email = "jakubbogacz05@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3 (>=1.43.51,<2.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)"
]

[tool.poetry]
packages = [{include = "ml_common", from = "src"}]
include = ["src/ml_common/py.typed"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "boto3-stubs[s3] (>=1.43.53,<2.0.0)"
]
[tool.mypy]
plugins = ["pydantic.mypy"]